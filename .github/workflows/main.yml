# Build using Alire and deliver an executable artifact for Windows, Linux and macOS.
# For Linux, an AppImage is also delivered.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: CI on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:    
       - name: Checkout
         uses: actions/checkout@v2
       - name: ada-actions/toolchain
         if: runner.os == 'Windows' # This is needed on Windows, but failing on macos. Not needed nor failing on Linux
         uses: ada-actions/toolchain@ce2021
         with:
           distrib: community
           target: native         
       - name: alire-project/setup-alire
         uses: alire-project/setup-alire@v5
       - name: Update apt
         if: runner.os == 'Linux'
         run: sudo apt-get update
       - name: Update
         run: alr index --update-all
       - name: Build
         run: alr --non-interactive build
       - name: Install
         run: alr --non-interactive install --prefix=play_2048_folder

       # On Windows, install zip as it is not available by default
       - name: Install zip (Windows)
         if: runner.os == 'Windows'
         run: choco install zip

       - name: Package binaries
         shell: bash
         run: |
           zip -r play_2048-${{ runner.os }}.zip play_2048_folder/

       - name: Create Release
         uses: ncipollo/release-action@v1
         with:
           allowUpdates: True
           tag: continuous
           name: Continuous build
           prerelease: True
           artifacts: "play_2048-${{ runner.os }}.zip"
           token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Continuous Packages
    runs-on: ubuntu-20.04
    steps:
       - name: Checkout
         uses: actions/checkout@v2
       - name: alr2appimage-action
         uses: mgrojo/alr2appimage-action@v1
         with:
           alr2appimageArgs: "-o appimage,deb,rpm --use-version" # Arguments to pass to alr2appimage
           tagName: "continuous" # Tag to use for your application release.
           deleteExistent: true # Delete the tag and release if already existent
